  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n        <\u002Fdetails>\n        <details class=\"se-faq\" data-reveal=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .8s cubic-bezier(.16,1,.3,1) .1s;background:#141210;border:1px solid rgba(250,246,241,.1);border-radius:12px;overflow:hidden;\">\n          <summary style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 28px;cursor:pointer;list-style:none;font-weight:700;font-size:1.1rem;color:rgba(250,246,241,.92);\">Προσφέρετε εφάπαξ υπηρεσίες ή μακροχρόνιες συνεργασίες;<span class=\"se-faq-plus\" style=\"font-size:1.6rem;font-weight:400;color:#f0bd95;flex:none;transition:transform .35s cubic-bezier(.16,1,.3,1);line-height:1;\">+<\u002Fspan><\u002Fsummary>\n          <div style=\"padding:0 28px 26px;font-size:1.02rem;color:rgba(250,246,241,.62);line-height:1.65;\">Και τα δύο! Μπορούμε να δημιουργήσουμε ένα εφάπαξ πακέτο playlist ή να γίνουμε ο μακροπρόθεσμος μουσικός συνεργάτης σας με τακτικές ενημερώσεις και εποχιακές ανανεώσεις.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"se-faq\" data-reveal=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .8s cubic-bezier(.16,1,.3,1) .15s;background:#141210;border:1px solid rgba(250,246,241,.1);border-radius:12px;overflow:hidden;\">\n          <summary style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 28px;cursor:pointer;list-style:none;font-weight:700;font-size:1.1rem;color:rgba(250,246,241,.92);\">Πόσο χρόνο χρειάζεται για να λάβουμε το πρώτο μας playlist;<span class=\"se-faq-plus\" style=\"font-size:1.6rem;font-weight:400;color:#f0bd95;flex:none;transition:transform .35s cubic-bezier(.16,1,.3,1);line-height:1;\">+<\u002Fspan><\u002Fsummary>\n          <div style=\"padding:0 28px 26px;font-size:1.02rem;color:rgba(250,246,241,.62);line-height:1.65;\">Συνήθως 1–2 εβδομάδες μετά την αρχική μας συνεννόηση, ανάλογα με την πολυπλοκότητα των αναγκών σας.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u00 1380px;margin:48px auto 0;padding:24px 32px;border-top:1px solid rgba(250,246,241,.1);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;\">\n      <span style=\"font-size:12px;color:rgba(250,246,241,.4);\">© 2026 SensEar Music. Με την επιφύλαξη παντός δικαιώματος.<\u002Fspan>\n      <div style=\"display:flex;gap:20px;\">\n        <a href=\"#\" style=\"font-size:12px;color:rgba(250,246,241,.4);text-decoration:none;\">Πολιτική Απορρήτου<\u002Fa>\n        <a href=\"#\" style=\"font-size:12px;color:rgba(250,246,241,.4);text-decoration:none;\">Όροι Χρήσης<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"overflow:hidden;line-height:.8;padding:30px 0 24px;\">\n      <div style=\"font-weight:900;letter-spacing:-.02em;font-size:clamp(4rem,15.5vw,15rem);text-align:center;color:transparent;-webkit-text-stroke:1px rgba(250,246,241,.14);\">SENSEAR<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f0bd95&quot;,&quot;options&quot;:[&quot;#f0bd95&quot;,&quot;#faebe3&quot;,&quot;#e8a87c&quot;,&quot;#c9b8a8&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const root = document.getElementById('sensear-root') || document;\n\n    const accent = this.props.accentColor;\n    if (accent) {\n      document.documentElement.style.setProperty('--accent', accent);\n      root.style.setProperty('--accent', accent);\n    }\n\n    const reduce = !!this.props.reduceMotion;\n    const els = Array.prototype.slice.call(root.querySelectorAll('[data-reveal]'));\n\n    if (reduce) {\n      els.forEach(e => { e.style.opacity = 1; e.style.transform = 'none'; });\n      root.querySelectorAll('[data-spin]').forEach(e => { e.style.animationPlayState = 'paused'; });\n    } else {\n      // Reveal each element as it scrolls into view (matches the live site's\n      // whileInView behaviour). Trigger ~12% before the element fully enters.\n      const show = (e) => { e.style.opacity = 1; e.style.transform = 'none'; };\n\n      if ('IntersectionObserver' in window) {\n        const io = new IntersectionObserver((entries, obs) => {\n          entries.forEach(en => {\n            if (en.isIntersecting) { show(en.target); obs.unobserve(en.target); }\n          });\n        }, { root: null, rootMargin: '0px 0px -12% 0px', threshold: 0.05 });\n        els.forEach(e => io.observe(e));\n        this._io = io;\n      }\n\n      // Scroll fallback (covers frames where IO is throttled/unavailable).\n      // Only reveals elements actually in the viewport — never below the fold.\n      const reveal = () => {\n        const vh = window.innerHeight || document.documentElement.clientHeight;\n        els.forEach(e => {\n          if (getComputedStyle(e).opacity === '1') return;\n          const r = e.getBoundingClientRect();\n          if (r.top < vh * 0.92 && r.bottom > 0) show(e);\n        });\n      };\n      this._onReveal = reveal;\n      window.addEventListener('scroll', reveal, { passive: true });\n      window.addEventListener('resize', reveal, { passive: true });\n      reveal();\n    }\n\n    const nav = document.getElementById('se-nav');\n    this._onScroll = () => {\n      if (!nav) return;\n      if (window.scrollY > 60) {\n        nav.style.background = 'rgba(11,10,10,.82)';\n        nav.style.backdropFilter = 'blur(12px)';\n        nav.style.borderBottomColor = 'rgba(250,246,241,.1)';\n        nav.style.padding = '14px 0';\n      } else {\n        nav.style.background = 'transparent';\n        nav.style.backdropFilter = 'none';\n        nav.style.borderBottomColor = 'rgba(250,246,241,0)';\n        nav.style.padding = '22px 0';\n      }\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    // FAQ accordion: only one open at a time\n    const faqs = Array.prototype.slice.call(root.querySelectorAll('.se-faq'));\n    faqs.forEach(d => {\n      d.addEventListener('toggle', () => {\n        if (d.open) faqs.forEach(o => { if (o !== d) o.open = false; });\n      });\n    });\n\n    const footer = root.querySelector('footer');\n    if (footer) {\n      footer.querySelectorAll('a').forEach(a => {\n        if (a.classList.contains('se-email')) return;\n        if (!/(#|\\.dc\\.html)/.test(a.getAttribute('href') || '')) return;\n        a.style.backgroundImage = 'var(--gold-text)';\n        a.style.backgroundRepeat = 'no-repeat';\n        a.style.backgroundPosition = '0 100%';\n        a.style.backgroundSize = '0% 1.5px';\n        a.style.paddingBottom = '3px';\n        a.style.display = 'inline-block';\n        a.style.alignSelf = 'flex-start';\n        a.style.transition = 'background-size .35s cubic-bezier(.16,1,.3,1),color .3s ease';\n        a.addEventListener('mouseenter', () => { a.style.backgroundSize = '100% 1.5px'; a.style.color = '#faf6f1'; });\n        a.addEventListener('mouseleave', () => { a.style.backgroundSize = '0% 1.5px'; a.style.color = 'rgba(250,246,241,.62)'; });\n      });\n    }\n\n    root.querySelectorAll('.se-email').forEach(a => {\n      const addr = (a.dataset.u || '') + '@' + (a.dataset.d || '');\n      a.href = 'mailto:' + addr;\n      const t = a.querySelector('.se-email-txt');\n      if (t) t.textContent = addr;\n    });\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n    if (this._onReveal) {\n      window.removeEventListener('scroll', this._onReveal);\n      window.removeEventListener('resize', this._onReveal);\n    }\n  }\n\n  renderVals() {\n    return {\n      onContactSubmit: (e) => {\n        e.preventDefault();\n        const form = document.getElementById('se-form');\n        const ok = document.getElementById('se-success');\n        if (form) form.style.display = 'none';\n        if (ok) { ok.style.display = 'block'; ok.scrollIntoView ? null : null; }\n        const sec = document.getElementById('form');\n        if (sec) { const y = sec.getBoundingClientRect().top + window.scrollY - 90; window.scrollTo({ top: y, behavior: 'smooth' }); }\n      },\n      onResetForm: () => {\n        const form = document.getElementById('se-form');\n        const ok = document.getElementById('se-success');\n        if (form) { form.reset(); form.style.display = 'block'; }\n        if (ok) ok.style.display = 'none';\n      },\n      onFieldFocus: (e) => { const f = e.currentTarget; f.style.borderColor = 'rgba(240,189,149,.6)'; f.style.background = 'rgba(240,189,149,.06)'; },\n      onFieldBlur: (e) => { const f = e.currentTarget; f.style.borderColor = 'rgba(250,246,241,.16)'; f.style.background = 'rgba(250,246,241,.05)'; },\n      onCtaEnter: (e) => {\n        const a = e.currentTarget;\n        a.style.background = '#0b0a0a'; a.style.color = '#faf6f1'; a.style.boxShadow = 'inset 0 0 0 1.5px rgba(227,153,47,.85)';\n        const ico = a.querySelector('.se-cta-ico'); if (ico) { ico.style.opacity = '0'; ico.style.width = '0'; ico.style.transform = 'scale(0)'; ico.style.marginRight = '-10px'; }\n        const arr = a.querySelector('.se-cta-arrow'); if (arr) { arr.style.maxWidth = '22px'; arr.style.opacity = '1'; arr.style.marginLeft = '9px'; }\n      },\n      onCtaLeave: (e) => {\n        const a = e.currentTarget;\n        a.style.background = 'var(--gold)'; a.style.color = '#0b0a0a'; a.style.boxShadow = 'none';\n        const ico = a.querySelector('.se-cta-ico'); if (ico) { ico.style.opacity = '1'; ico.style.width = '20px'; ico.style.transform = 'scale(1)'; ico.style.marginRight = '0'; }\n        const arr = a.querySelector('.se-cta-arrow'); if (arr) { arr.style.maxWidth = '0'; arr.style.opacity = '0'; arr.style.marginLeft = '0'; }\n      },\n      onGhostEnter: (e) => { const a = e.currentTarget; a.style.background = 'var(--gold)'; a.style.color = '#0b0a0a'; a.style.borderColor = 'transparent'; },\n      onGhostLeave: (e) => { const a = e.currentTarget; a.style.background = 'transparent'; a.style.color = '#faf6f1'; a.style.borderColor = 'rgba(250,246,241,.35)'; },\n      onNavEnter: (e) => { e.currentTarget.style.backgroundSize = '100% 2px'; e.currentTarget.style.color = '#faf6f1'; },\n      onNavLeave: (e) => { e.currentTarget.style.backgroundSize = '0% 2px'; e.currentTarget.style.color = 'rgba(250,246,241,.72)'; },\n      onPillEnter: (e) => { e.currentTarget.style.transform = 'translateY(-3px)'; },\n      onPillLeave: (e) => { e.currentTarget.style.transform = 'translateY(0)'; },\n      onSubEnter: (e) => { const b = e.currentTarget; b.style.boxShadow = '0 6px 22px -6px rgba(220,162,81,.6)'; const a = b.querySelector('.se-sub-arrow'); if (a) a.style.transform = 'translateX(4px)'; },\n      onSubLeave: (e) => { const b = e.currentTarget; b.style.boxShadow = 'none'; const a = b.querySelector('.se-sub-arrow'); if (a) a.style.transform = 'none'; },\n      onSubmit: (e) => { e.preventDefault(); const i = e.currentTarget.querySelector('input'); if (i) { i.value = ''; i.placeholder = 'Ευχαριστούμε! ✦'; } }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
