document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{ onNavLeave }}\">Case Studies<\u002Fa>\n        <a href=\"SensEar Journal.dc.html#journal\" class=\"se-navlink\" style=\"font-size:13px;letter-spacing:.08em;font-weight:700;color:#faf6f1;text-decoration:none;background-image:var(--gold-text);background-repeat:no-repeat;background-position:0 100%;background-size:100% 2px;padding-bottom:5px;transition:background-size .35s cubic-bezier(.16,1,.3,1),color .3s ease;\">Journal<\u002Fa>\n        <a href=\"SensEar About.dc.html#team\" class=\"se-navlink\" style=\"font-size:13px;letter-spacing:.08em;font-weight:600;color:rgba(250,246,241,.72);text-decoration:none;background-image:var(--gold-text);background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;padding-bottom:5px;transition:background-size .35s cubic-bezier(.16,1,.3,1),color .3s ease;\" onmouseenter=\"{{ onNavEnter }}\" onmouseleave=\"{{ onNavLeave }}\">Σχετικά<\u002Fa>\n        <a href=\"SensEar Contact.dc.html\" style=\"font-size:13px;letter-spacing:.08em;font-weight:700;color:#0b0a0a;background:var(--gold);text-decoration:none;padding:11px 22px;border-radius:100px;transition:transform .3s ease;\" onmouseenter=\"{{ onPillEnter }}\" onmouseleave=\"{{ onPillLeave }}\">Επικοινωνία<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ARTICLE HERO -->\n  <section id=\"top\" style=\"position:relative;padding:170px 0 70px;overflow:hidden;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;top:-10%;right:-6%;width:56vw;height:56vw;max-width:720px;max-height:720px;background:radial-gradient(circle,rgba(240,189,149,.16),rgba(240,189,149,0) 62%);filter:blur(20px);animation:se-drift 18s ease-in-out infinite;pointer-events:none;\"><\u002Fdiv>\n\n    <div style=\"max-width:1280px;margin:0 auto;padding:0 32px;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;\">\n      <div>\n        <a href=\"SensEar Journal.dc.html#journal\" data-reveal=\"\" class=\"se-back\" style=\"display:inline-flex;align-items:center;gap:10px;color:rgba(250,246,241,.5);text-decoration:none;margin-bottom:38px;transition:color .3s ease;\">\n          <span class=\"se-back-arrow\" style=\"display:inline-block;font-size:17px;transition:transform .35s cubic-bezier(.16,1,.3,1);\">←<\u002Fspan>\n          <span style=\"font-size:12px;letter-spacing:.22em;font-weight:700;text-transform:uppercase;\">Πίσω στα Άρθρα<\u002Fspan>\n        <\u002Fa>\n        <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px;margin-bottom:26px;\">\n          <span style=\"width:34px;height:1px;background:var(--gold);display:inline-block;\"><\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:.3em;font-weight:700;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;\">INSIGHTS · ΦΙΛΟΞΕΝΙΑ<\u002Fspan>\n        <\u002Fdiv>\n        <h1 data-reveal=\"\" style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(2.3rem,4.6vw,4.1rem);line-height:1.07;letter-spacing:-.022em;margin-bottom:28px;\">Γιατί η Μουσική Έχει Σημασία στη <span style=\"font-family:'GFS Didot',serif;font-style:italic;font-size:1.08em;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;\">Φιλοξενία<\u002Fspan><\u002Fh1>\n        <p data-reveal=\"\" style=\"font-size:clamp(1.08rem,1.5vw,1.3rem);font-weight:500;line-height:1.55;color:rgba(250,246,241,.72);max-width:560px;margin-bottom:36px;\">Δείτε γιατί η επιμελημένη μουσική είναι πρακτικό εργαλείο για την εμπειρία επισκέπτη, τη μνήμη του brand και τη δαπάνη στη φιλοξενία.<\u002Fp>\n        <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:rgba(250,246,241,.6);font-weight:500;\">\n          <div style=\"display:flex;align-items:center;gap:12px;\">\n            <span style=\"width:30px;height:1px;background:rgba(250,246,241,.25);display:inline-block;\"><\u002Fspan>\n            <span style=\"color:#faf6f1;font-weight:700;text-transform:uppercase;letter-spacing:.12em;\">Ομάδα SensEar<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"width:4px;height:4px;border-radius:50%;background:rgba(250,246,241,.25);\"><\u002Fspan>\n          <span style=\"text-transform:uppercase;letter-spacing:.12em;\">15 Ιανουαρίου 2025<\u002Fspan>\n          <span style=\"width:4px;height:4px;border-radius:50%;background:rgba(250,246,241,.25);\"><\u002Fspan>\n          <span style=\"text-transform:uppercase;letter-spacing:.12em;\">8 MIN READ<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <a href=\"#\" data-reveal=\"\" class=\"se-card\" style=\"position:relative;text-decoration:none;display:block;\">\n        <div style=\"position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;box-shadow:0 40px 90px -30px rgba(0,0,0,.8);\">\n          <img src=\"486918e9-8099-4aa4-81d9-2875e86ae70e\" alt=\"Εσωτερικό πολυτελούς ξενοδοχείου που αναδεικνύει τον ρόλο της μουσικής στη στρατηγική marketing φιλοξενίας\" class=\"se-card-img\" style=\"width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,1,.3,1);\">\n          <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,10,0) 55%,rgba(11,10,10,.4));\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;top:-18px;right:-18px;width:92px;height:92px;border-radius:50%;border:1px solid rgba(250,246,241,.25);display:flex;align-items:center;justify-content:center;background:rgba(11,10,10,.55);backdrop-filter:blur(4px);animation:se-spin 24s linear infinite;\" data-spin=\"\">\n          <span style=\"font-size:9px;letter-spacing:.18em;font-weight:700;color:rgba(250,246,241,.6);text-align:center;line-height:1.5;\">★ SENSEAR ★<br>JOURNAL<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ARTICLE BODY -->\n  <section style=\"padding:40px 0 110px;background:#0e0d0c;border-top:1px solid rgba(250,246,241,.08);position:relative;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;top:8%;left:-6%;width:42vw;max-width:520px;height:42vw;max-height:520px;background:radial-gradient(circle,rgba(240,189,149,.08),rgba(240,189,149,0) 62%);filter:blur(24px);pointer-events:none;z-index:0;animation:se-drift 26s ease-in-out infinite reverse;\"><\u002Fdiv>\n    <div style=\"max-width:760px;margin:0 auto;padding:80px 32px 0;position:relative;z-index:1;\">\n\n      <h2 data-reveal=\"\" style=\"font-weight:800;font-size:clamp(1.6rem,2.7vw,2.3rem);line-height:1.16;letter-spacing:-.018em;margin-bottom:24px;\">Με μια ματιά: η προσεκτικά διαλεγμένη μουσική είναι ένας πρακτικός τρόπος να διαμορφώνεται τα συναισθήματα, τις μνήμες και τις δαπάνες των επισκεπτών<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:56px;\">Τα περισσότερα κορυφαία luxury ξενοδοχειακά brands αντιμετωπίζουν την εμπειρία ως ένα ολοκληρωμένο σύστημα σχεδιασμού. Κάθε απόφαση λαμβάνεται κατόπιν μελέτης, από την αρχιτεκτονική και τα υλικά μέχρι τον ήχο που «ντύνει» τον κάθε χώρο.<\u002Fp>\n\n      <h2 data-reveal=\"\" style=\"font-weight:800;font-size:clamp(1.6rem,2.7vw,2.3rem);line-height:1.16;letter-spacing:-.018em;margin-bottom:24px;\">Η μουσική και η εμπειρία του επισκέπτη<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:24px;\">Η μουσική είναι ένας άμεσος, οικονομικά αποδοτικός τρόπος για να ορίσετε τη διάθεση και να συνδεθείτε με το κοινό στο οποίο απευθύνεστε. Οι σωστές επιλογές δένονται απόλυτα με τις αξίες, το γούστο και τις προσδοκίες των επισκεπτών.<\u002Fp>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:56px;\">Το <a href=\"https://academic.oup.com/jcr/article-abstract/13/2/286/1846377\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">αργό tempo<\u002Fa> μπορεί να επιμηκύνει την παραμονή και να αυξήσει τις πωλήσεις σε ορισμένα περιβάλλοντα, ενώ οι <a href=\"https://www.deepdyve.com/lp/sage/using-background-music-to-affect-the-behavior-of-supermarket-shoppers-0MSfbyjTU0\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">πιο γρήγοροι ρυθμοί<\u002Fa> βοηθούν στην επιτάχυνση της κίνησης όταν η ταχύτερη εναλλαγή τραπεζιών αποτελεί προτεραιότητα. Η μουσική μπορεί επίσης να μεταβάλει τον <a href=\"https://www.sciencedirect.com/science/article/pii/S014829639900003X\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">αντιλαμβανόμενο χρόνο<\u002Fa> και να επηρεάσει την αξιολόγηση του χώρου, κάτι που είναι χρήσιμο για τη <a href=\"https://journals.sagepub.com/doi/pdf/10.1177/00222437221150930\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">διαχείριση της ροής του service<\u002Fa> και την ικανοποίηση των επισκεπτών.<\u002Fp>\n\n      <h2 data-reveal=\"\" style=\"font-weight:800;font-size:clamp(1.6rem,2.7vw,2.3rem);line-height:1.16;letter-spacing:-.018em;margin-bottom:24px;\">Η μουσική και η ταυτότητα του brand<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:56px;\">Ο ήχος αποτελεί μέρος της μνήμης του brand. Οι σταθερές, στοχευμένες μουσικές επιλογές κάνουν έναν χώρο να μοιάζει απόλυτα συνεπής (on-brand) και αναγνωρίσιμος, με τον ίδιο ακριβώς τρόπο που το πετυχαίνουν τα χρώματα, η τυπογραφία και τα υλικά. <a href=\"https://www.sciencedirect.com/science/article/pii/S0001691824002105\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">Έρευνες στο μάρκετινγκ και την ψυχολογία του καταναλωτή<\u002Fa> δείχνουν ότι το sonic branding και τα μουσικά ερεθίσματα μπορούν να διαμορφώσουν την ανάκληση στη μνήμη (recall) και την πρόθεση αγοράς. Η εναρμόνιση των playlists με το περιβάλλον και την επιθυμητή αίσθηση του brand δημιουργεί ένα <a href=\"https://etheses.whiterose.ac.uk/id/eprint/22404/1/Wong%202018%20-%20Sound%20Branding%20-%20FINAL%20DEC%202018.pdf\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">ανταγωνιστικό πλεονέκτημα<\u002Fa> που η γενική μουσική υπόκρουση δεν μπορεί να πλησιάσει.<\u002Fp>\n\n      <h2 data-reveal=\"\" style=\"font-weight:800;font-size:clamp(1.6rem,2.7vw,2.3rem);line-height:1.16;letter-spacing:-.018em;margin-bottom:24px;\">Η μουσική και η παραγωγικότητα της ομάδας<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:24px;\">Η μουσική επηρεάζει άμεσα και το προσωπικό σας. <a href=\"https://hbr.org/2022/09/can-music-make-you-more-productive\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">Μελέτες ειδικών<\u002Fa> υποδεικνύουν ότι το σωστό ηχητικό περιβάλλον μπορεί να βελτιώσει τη διάθεση και την απόδοση της ομάδας, γι' αυτό και ο σωστός προγραμματισμός ανάλογα με την ώρα της ημέρας έχει τεράστια σημασία. <a href=\"https://cloudcovermusic.com/research/music-at-work-research\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">Μια ακόμα έρευνα του κλάδου<\u002Fa> απηχεί αυτή την αντίληψη, με μεγάλο μέρος των εργαζομένων να αναφέρει ότι εργάζεται καλύτερα με την κατάλληλη μουσική στο υπόβαθρο.<\u002Fp>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:24px;\">Ο <a href=\"SensEar Sonic Identity.dc.html#top\" class=\"se-link\">ακουστικός σχεδιασμός<\u002Fa> ανήκει δίπλα στον οπτικό και αρχιτεκτονικό σχεδιασμό στην πολυτελή φιλοξενία. Ενισχύει την εμπειρία των επισκεπτών, υποστηρίζει άμεσα τα εμπορικά αποτελέσματα (KPIs) και συμβάλλει στο υψηλότερο ηθικό και την παραγωγικότητα των εργαζομένων. <a href=\"https://academic.oup.com/jcr/article-abstract/13/2/286/1846377\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"se-link\">Μελέτες σε λιανικό εμπόριο και εστιατόρια<\u002Fa> αποδεικνύουν ότι η σωστή επιλογή tempo και ύφους αλλάζει τον ρυθμό, την αντίληψη του χρόνου και τις δαπάνες, κάτι που μεταφράζεται άμεσα σε μετρήσιμα αποτελέσματα σε πολυτελείς χώρους όταν εφαρμόζεται με φροντίδα.<\u002Fp>\n      <p data-reveal=\"\" style=\"font-size:1.16rem;line-height:1.78;color:rgba(250,246,241,.78);margin-bottom:64px;\">Δείτε πώς οι <a href=\"SensEar Signature Playlists.dc.html#top\" class=\"se-link\">επιμελημένες μουσικές λίστες<\u002Fa> μπορούν να αναβαθμίσουν το brand σας. <a href=\"SensEar Contact.dc.html\" class=\"se-link\">Ξεκινήστε τον σχεδιασμό εδώ<\u002Fa>.<\u002Fp>\n\n      <div data-reveal=\"\" style=\"padding-top:44px;border-top:1px solid rgba(250,246,241,.12);text-align:center;\">\n        <a href=\"SensEar Journal.dc.html#journal\" class=\"se-outline\" style=\"display:inline-flex;align-items:center;gap:12px;border:1.5px solid rgba(250,246,241,.4);color:#faf6f1;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:16px 38px;border-radius:100px;transition:background .4s ease,color .4s ease,border-color .4s ease;\" onmouseenter=\"{{ onOutEnter }}\" onmouseleave=\"{{ onOutLeave }}\">\n          <span class=\"se-out-arrow\" style=\"display:inline-block;font-size:16px;transition:transform .35s cubic-bezier(.16,1,.3,1);\">←<\u002Fspan>\n          Πίσω στα Άρθρα\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section id=\"cta\" style=\"position:relative;padding:150px 0;overflow:hidden;\">\n    <img src=\"d30f6e3f-3f17-4546-a015-23a0588ba9b5\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,10,.82),rgba(11,10,10,.93));\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1100px;margin:0 auto;padding:0 32px;text-align:center;\">\n      <div data-reveal=\"\" style=\"font-size:12px;letter-spacing:.34em;font-weight:700;background:var(--gold-text);-webkit-background-clip:tex sEar Industries.dc.html#industries\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Εκδηλώσεις &amp; Εμπειρίες<\u002Fa>\n          <a href=\"SensEar Industries.dc.html#industries\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Καταστήματα Λιανικής<\u002Fa>\n          <a href=\"SensEar Industries.dc.html#industries\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Wellness &amp; Γυμναστήρια<\u002Fa>\n          <a href=\"SensEar Industries.dc.html#industries\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Τέχνη, Μουσεία &amp; Μόδα<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.22em;font-weight:700;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;margin-bottom:18px;\">ΕΤΑΙΡΕΙΑ<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;\">\n          <a href=\"SensEar Case Studies.dc.html\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Έργα<\u002Fa>\n          <a href=\"SensEar Journal.dc.html#journal\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Journal<\u002Fa>\n          <a href=\"SensEar About.dc.html#team\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Σχετικά<\u002Fa>\n          <a href=\"SensEar Contact.dc.html\" style=\"font-size:.95rem;color:rgba(250,246,241,.62);text-decoration:none;\">Επικοινωνία<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.22em;font-weight:700;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;margin-bottom:18px;\">ΕΓΓΡΑΦΗ ΣΤΟ JOURNAL<\u002Fdiv>\n        <p style=\"font-size:.9rem;color:rgba(250,246,241,.5);line-height:1.55;margin-bottom:16px;\">Σκέψεις για μουσική, ατμόσφαιρα &amp; sonic branding.<\u002Fp>\n        <form onsubmit=\"{{ onSubmit }}\" style=\"display:flex;gap:8px;\">\n          <input type=\"email\" required=\"\" placeholder=\"Το email σας\" style=\"flex:1;background:rgba(250,246,241,.06);border:1px solid rgba(250,246,241,.16);border-radius:100px;padding:12px 18px;color:#faf6f1;font-size:.9rem;font-family:'Montserrat',sans-serif;outline:none;\">\n          <button type=\"submit\" class=\"se-sub\" style=\"position:relative;overflow:hidden;flex:none;background:var(--gold);color:#0b0a0a;border:none;border-radius:100px;padding:12px 22px;font-weight:700;font-size:1rem;cursor:pointer;transition:box-shadow .35s ease,background .35s ease,color .35s ease;\" onmouseenter=\"{{ onSubEnter }}\" onmouseleave=\"{{ onSubLeave }}\"><span class=\"se-sub-arrow\" style=\"display:inline-block;transition:transform .35s cubic-bezier(.16,1,.3,1);\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1380px;margin:48px auto 0;padding:24px 32px;border-top:1px solid rgba(250,246,241,.1);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;\">\n      <span style=\"font-size:12px;color:rgba(250,246,241,.4);\">© 2026 SensEar Music. Με την επιφύλαξη παντός δικαιώματος.<\u002Fspan>\n      <div style=\"display:flex;gap:20px;\">\n        <a href=\"#\" style=\"font-size:12px;color:rgba(250,246,241,.4);text-decoration:none;\">Πολιτική Απορρήτου<\u002Fa>\n        <a href=\"#\" style=\"font-size:12px;color:rgba(250,246,241,.4);text-decoration:none;\">Όροι Χρήσης<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"overflow:hidden;line-height:.8;padding:30px 0 24px;\">\n      <div style=\"font-weight:900;letter-spacing:-.02em;font-size:clamp(4rem,15.5vw,15rem);text-align:center;color:transparent;-webkit-text-stroke:1px rgba(250,246,241,.14);\">SENSEAR<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f0bd95&quot;,&quot;options&quot;:[&quot;#f0bd95&quot;,&quot;#faebe3&quot;,&quot;#e8a87c&quot;,&quot;#c9b8a8&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const root = document.getElementById('sensear-root') || document;\n\n    const accent = this.props.accentColor;\n    if (accent) {\n      document.documentElement.style.setProperty('--accent', accent);\n      root.style.setProperty('--accent', accent);\n    }\n\n    const reduce = !!this.props.reduceMotion;\n    const els = Array.prototype.slice.call(root.querySelectorAll('[data-reveal]'));\n\n    if (reduce) {\n      els.forEach(e => { e.setAttribute('data-shown', ''); e.style.transition = 'none'; e.style.opacity = '1'; e.style.transform = 'none'; });\n      root.querySelectorAll('[data-spin]').forEach(e => { e.style.animationPlayState = 'paused'; });\n    } else {\n      // Reveal with the CSS transition, then harden to the final visible state\n      // so a throttled/frozen animation clock can never leave content blank.\n      const show = (e) => {\n        e.setAttribute('data-shown', '');\n        setTimeout(() => { e.style.transition = 'none'; e.style.opacity = '1'; e.style.transform = 'none'; }, 1000);\n      };\n      if ('IntersectionObserver' in window) {\n        const io = new IntersectionObserver((entries, obs) => {\n          entries.forEach(en => { if (en.isIntersecting) { show(en.target); obs.unobserve(en.target); } });\n        }, { root: null, rootMargin: '0px 0px -12% 0px', threshold: 0.05 });\n        els.forEach(e => io.observe(e));\n        this._io = io;\n      }\n      const reveal = () => {\n        const vh = window.innerHeight || document.documentElement.clientHeight;\n        els.forEach(e => {\n          if (e.hasAttribute('data-shown')) return;\n          const r = e.getBoundingClientRect();\n          if (r.top < vh * 0.92 && r.bottom > 0) show(e);\n        });\n      };\n      this._onReveal = reveal;\n      window.addEventListener('scroll', reveal, { passive: true });\n      window.addEventListener('resize', reveal, { passive: true });\n      reveal();\n    }\n\n    const nav = document.getElementById('se-nav');\n    this._onScroll = () => {\n      if (!nav) return;\n      if (window.scrollY > 60) {\n        nav.style.background = 'rgba(11,10,10,.82)';\n        nav.style.backdropFilter = 'blur(12px)';\n        nav.style.borderBottomColor = 'rgba(250,246,241,.1)';\n        nav.style.padding = '14px 0';\n      } else {\n        nav.style.background = 'transparent';\n        nav.style.backdropFilter = 'none';\n        nav.style.borderBottomColor = 'rgba(250,246,241,0)';\n        nav.style.padding = '22px 0';\n      }\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    // hero image zoom\n    root.querySelectorAll('.se-card').forEach(card => {\n      const img = card.querySelector('.se-card-img');\n      if (!img) return;\n      card.addEventListener('mouseenter', () => { img.style.transform = 'scale(1.05)'; });\n      card.addEventListener('mouseleave', () => { img.style.transform = 'none'; });\n    });\n\n    // back link arrow nudge\n    root.querySelectorAll('.se-back').forEach(a => {\n      const ar = a.querySelector('.se-back-arrow');\n      a.addEventListener('mouseenter', () => { a.style.color = '#faf6f1'; if (ar) ar.style.transform = 'translateX(-4px)'; });\n      a.addEventListener('mouseleave', () => { a.style.color = 'rgba(250,246,241,.5)'; if (ar) ar.style.transform = 'none'; });\n    });\n\n    // inline body links — gold underline grow\n    root.querySelectorAll('.se-link').forEach(a => {\n      a.style.color = '#f0bd95';\n      a.style.fontWeight = '600';\n      a.style.textDecoration = 'none';\n      a.style.backgroundImage = 'linear-gradient(rgba(240,189,149,.45),rgba(240,189,149,.45))';\n      a.style.backgroundRepeat = 'no-repeat';\n      a.style.backgroundPosition = '0 100%';\n      a.style.backgroundSize = '100% 1.5px';\n      a.style.paddingBottom = '1px';\n      a.style.transition = 'background-size .35s cubic-bezier(.16,1,.3,1),color .3s ease';\n      a.addEventListener('mouseenter', () => { a.style.color = '#fadbc4'; a.style.backgroundSize = '100% 2px'; });\n      a.addEventListener('mouseleave', () => { a.style.color = '#f0bd95'; a.style.backgroundSize = '100% 1.5px'; });\n    });\n\n    // footer nav underline\n    const footer = root.querySelector('footer');\n    if (footer) {\n      footer.querySelectorAll('a').forEach(a => {\n        if (a.classList.contains('se-email')) return;\n        if (!/(#|\\.dc\\.html)/.test(a.getAttribute('href') || '')) return;\n        a.style.backgroundImage = 'var(--gold-text)';\n        a.style.backgroundRepeat = 'no-repeat';\n        a.style.backgroundPosition = '0 100%';\n        a.style.backgroundSize = '0% 1.5px';\n        a.style.paddingBottom = '3px';\n        a.style.display = 'inline-block';\n        a.style.alignSelf = 'flex-start';\n        a.style.transition = 'background-size .35s cubic-bezier(.16,1,.3,1),color .3s ease';\n        a.addEventListener('mouseenter', () => { a.style.backgroundSize = '100% 1.5px'; a.style.color = '#faf6f1'; });\n        a.addEventListener('mouseleave', () => { a.style.backgroundSize = '0% 1.5px'; a.style.color = 'rgba(250,246,241,.62)'; });\n      });\n    }\n\n    root.querySelectorAll('.se-email').forEach(a => {\n      const addr = (a.dataset.u || '') + '@' + (a.dataset.d || '');\n      a.href = 'mailto:' + addr;\n      const t = a.querySelector('.se-email-txt');\n      if (t) t.textContent = addr;\n    });\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n    if (this._onReveal) {\n      window.removeEventListener('scroll', this._onReveal);\n      window.removeEventListener('resize', this._onReveal);\n    }\n  }\n\n  renderVals() {\n    return {\n      onCtaEnter: (e) => {\n        const a = e.currentTarget;\n        a.style.background = '#0b0a0a'; a.style.color = '#faf6f1'; a.style.boxShadow = 'inset 0 0 0 1.5px rgba(227,153,47,.85)';\n        const arr = a.querySelector('.se-cta-arrow'); if (arr) { arr.style.maxWidth = '22px'; arr.style.opacity = '1'; arr.style.marginLeft = '9px'; }\n      },\n      onCtaLeave: (e) => {\n        const a = e.currentTarget;\n        a.style.background = 'var(--gold)'; a.style.color = '#0b0a0a'; a.style.boxShadow = 'none';\n        const arr = a.querySelector('.se-cta-arrow'); if (arr) { arr.style.maxWidth = '0'; arr.style.opacity = '0'; arr.style.marginLeft = '0'; }\n      },\n      onOutEnter: (e) => { const a = e.currentTarget; a.style.background = 'var(--gold)'; a.style.color = '#0b0a0a'; a.style.borderColor = 'transparent'; const ar = a.querySelector('.se-out-arrow'); if (ar) ar.style.transform = 'translateX(-4px)'; },\n      onOutLeave: (e) => { const a = e.currentTarget; a.style.background = 'transparent'; a.style.color = '#faf6f1'; a.style.borderColor = 'rgba(250,246,241,.4)'; const ar = a.querySelector('.se-out-arrow'); if (ar) ar.style.transform = 'none'; },\n      onNavEnter: (e) => { e.currentTarget.style.backgroundSize = '100% 2px'; e.currentTarget.style.color = '#faf6f1'; },\n      onNavLeave: (e) => { e.currentTarget.style.backgroundSize = '0% 2px'; e.currentTarget.style.color = 'rgba(250,246,241,.72)'; },\n      onPillEnter: (e) => { e.currentTarget.style.transform = 'translateY(-3px)'; },\n      onPillLeave: (e) => { e.currentTarget.style.transform = 'translateY(0)'; },\n      onSubEnter: (e) => { const b = e.currentTarget; b.style.boxShadow = '0 6px 22px -6px rgba(220,162,81,.6)'; const a = b.querySelector('.se-sub-arrow'); if (a) a.style.transform = 'translateX(4px)'; },\n      onSubLeave: (e) => { const b = e.currentTarget; b.style.boxShadow = 'none'; const a = b.querySelector('.se-sub-arrow'); if (a) a.style.transform = 'none'; },\n      onSubmit: (e) => { e.preventDefault(); const i = e.currentTarget.querySelector('input'); if (i) { i.value = ''; i.placeholder = 'Ευχαριστούμε! ✦'; } }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
