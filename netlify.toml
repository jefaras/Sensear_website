# Netlify configuration for Next.js
# This file configures Netlify deployment while maintaining Plesk compatibility

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy default-locale URLs. Greek pages are served without the /el prefix.
[[redirects]]
  from = "/el"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/el/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/el/:page"
  to = "/:page/"
  status = 301
  force = true

[[redirects]]
  from = "/el/:page/"
  to = "/:page/"
  status = 301
  force = true

[[redirects]]
  from = "/el/:section/:slug"
  to = "/:section/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/el/:section/:slug/"
  to = "/:section/:slug/"
  status = 301
  force = true

# Temporary language negotiation for English. Greek is the default at /.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false
  conditions = {Language = ["en"]}
